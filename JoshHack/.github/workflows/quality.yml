
name: JoshHack Quality Checks

on:
  push:
  pull_request:
    branches:
      - main

jobs:
  quality-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run JUnit regression tests
        run: chmod +x mvnw && ./mvnw -B clean test

      - name: Run PIT mutation testing
        run: chmod +x mvnw && ./mvnw -B test-compile org.pitest:pitest-maven:mutationCoverage

      - name: Upload PIT report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: JoshHack-PIT-Report
          path: target/pit-reports/
          if-no-files-found: warn
